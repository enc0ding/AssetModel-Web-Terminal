# CI — least-privilege, egress-audited, SHA-pinned.
#
# Every third-party action is pinned to an immutable commit SHA (the tag is a
# comment so Dependabot can bump it). The job token is read-only. Install runs
# with --ignore-scripts so a poisoned dependency cannot execute during CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Source security scan (fails on HIGH)
        run: node tools/scan-source/scan-source.mjs . --ignore node_modules --md scan-report.md --fail-on high

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-report-node${{ matrix.node }}
          path: scan-report.md
          retention-days: 14
